{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – Breaking News</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">BREAKING<span>NEWS</span></div>
    <div class="login-tagline">Broadcast Management System</div>

    {% if form.errors %}
    <div class="login-errors">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div class="form-group">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">
        Sign In
      </button>
    </form>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
