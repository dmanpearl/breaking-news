      Disallow visitors from edit, send, or delete
  - id: feat_2026-03-04_Update_secure
    date: 2026-03-04
    title: Networking
    description: >
      Update SECURE_PROXY_SSL_HEADER and SECURE_SSL_REDIRECT for Squarespace hosting
  - id: feat_2026-03-04_Add
    date: 2026-03-04
    title: Connections
    description: >
      Add Enable/Disable controls in Admin view
  - id: feat_2026-03-04_Update_image
    date: 2026-03-04
    title: App Icon
    description: >
      update the Breaking News image icon  with a dark background to match the app bg color
  - id: feat_2026-03-04_support
    date: 2026-03-04
    title: Slack Attachments
    description: >
      Support image and PDF file attachments for Slack messages
  - id: feat_2026-03-02_add
    date: 2026-03-02
    title: Slack
    description: >
      Add Slack connection type
  - id: feat_2026-03-02_implement_delete
    date: 2026-03-02
    title: Message Delete
    description: >
      Implement the ability to delete messages. This feature allows users to permanently
      remove messages from the history view, providing a way to manage and organize their
      message history effectively. Deleted messages will no longer be visible in the history
      list, but may still be retained in the database for auditing purposes.
  - id: fix_2026-03-02_PDF
    date: 2026-03-02
    title: Maintain Filenames
    description: >
      Fix a bug for PDF uploads where the file was not retaining its original filename
  - id: feat_2026-03-02_display
    date: 2026-03-02
    title: Sender Name
    description: >
      Display the message sender's name in history and message view
  - id: feat_2026-03-01_Support
    date: 2026-03-01
    title: PDF Uploads
    description: >
      Support PDF file format uploads
  - id: fix_2026-03-01_fix_gif_bug
    date: 2026-03-01
    title: Fix GIF Images
    description: >
      Fix a bug where .gif images failed to upload by honoring the gif mime type through cloudinary and discord
  - id: feat_2026-03-01_Add
    date: 2026-03-01
    title: Authentication
    description: >
      Add eyeball button in password fields to view plaintext passwords (Login & Admin User Create)
  - id: feat_2026-03-01_install
    date: 2026-03-01
    title: Cloudinary
    description: >
      Install cloudinary for attached image caching. This enables uploaded images
      to be viewed in the history for any message on any device.
  - id: feat_2026-03-01_Implement
    date: 2026-03-01
    title: Paste and Drag-n-Drop
    description: >
      Implement the ability to quickly add images with clipboard paste and drag-n-drop
      functionality directly into the message body, streamlining the process of
      including visual content in messages.
  - id: feat_2026-02-28_Instant
    date: 2026-02-28
    title: Auto-Reload
    description: >
      After sending a message, immediately create a new message form so the user
      can begin typing the next message without needing to click New '+' again.
      This allows for a more seamless and efficient messaging experience,
      especially when sending multiple messages in quick succession.
  - id: feat_2026-02-28_Auto
    date: 2026-02-28
    title: Insta-Type
    description: >
      Auto-focus the cursor in the message body after pressing New '+' to enable
      instant typing and sending.
  - id: feat_2026-02-28_disable
    date: 2026-02-28
    title: Disable Headline
    description: >
      Removes the message headline. It's still there in case we want to add it
      back, but for now it was just taking up space and not adding much value.
  - id: feat_2026-02-28_Enter
    date: 2026-02-28
    title: Fast Send Hotkey
    description: >
      The keyboard Enter key now sends your message supporting rapid-fire distribution.
       Pressing Shift+Enter creates a new line without sending, allowing for multi-line messages.
       This feature is designed to enhance the speed and efficiency of message sending,
       making it easier to communicate quickly.
  - id: feat_2026-02-28_allow
    date: 2026-02-28
    title: Send
    description: >
      Implements message sending capability. Allows users to compose and send
      messages, which are then stored in the database and displayed in the history
      view. The message sending process includes form validation, error handling,
      and real-time updates to the message history.
  - id: fix_2026-02-27_history
    date: 2026-02-27
    title: History
    description: >
      Generate a list of recent messages in the history view in the left sidebar,
      ordered by date, with the most recent at the top. Clicking on a message in
      the history list expands it to show all details and any attachments.
  - id: feat_2026-02-27_initial
    date: 2026-02-27
    title: Initial Commit
    description: >
      This is the first check-in of the Breaking News codebase. It includes the
      initial implementation of the message history, message sending, and user
      authentication features. The codebase is built with Django and React, and
      is designed to be deployed on Railway.